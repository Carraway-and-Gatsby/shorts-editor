[project]
name = "shorts-analyze-worker"
version = "0.2.0"
description = "Scene/speech analysis worker for Shorts Editor"
requires-python = ">=3.11"
dependencies = [
    "redis>=5",
    "bullmq>=2.7",
    "psycopg[binary]>=3.1",
    "numpy>=1.26",
    "opencv-python-headless>=4.9,<5",
    "scenedetect>=0.6.4,<0.7",
    "boto3>=1.34",
]

[project.optional-dependencies]
# STT는 무겁기 때문에 분리 (Docker 이미지에서만 설치, CI/로컬 테스트는 제외 가능)
stt = [
    "faster-whisper>=1.0",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["build"]

[tool.ruff.lint]
# 기본 오류 규칙 + import 정렬. (의도적 blanket except가 있어 BLE 계열은 제외)
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
